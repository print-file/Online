<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Print Queue</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; --danger: #dc2626; --success: #059669; --gray: #4b5563; }
    body { background-color: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .btn { color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-view { background: var(--gray); }
    .btn-open { background: var(--success); }
    .btn-delete { background: var(--danger); }
    .btn-refresh { background: var(--primary); padding: 8px 16px; border-radius: 6px; font-size: 14px; }
    
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
    th { background: #f1f5f9; font-weight: 600; }
    
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; background: #e2e8f0; color: #475569; }
    .badge.success { background: #d1fae5; color: #065f46; }
    
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); padding: 20px; align-items: center; justify-content: center; z-index: 50; }
    .modal.active { display: flex; }
    .modal-content { background: white; width: 100%; max-width: 850px; padding: 25px; border-radius: 12px; max-height: 95vh; overflow-y: auto; }
    .close-btn { float: right; background: none; color: var(--danger); font-size: 24px; border: none; cursor: pointer; margin-top:-10px; }
    
    .load-more { display: block; width: 100%; text-align: center; background: #e2e8f0; color: #334155; padding: 12px; margin-top: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; border: none;}
    .load-more:hover { background: #cbd5e1; }
    
    .status-check { transform: scale(1.3); cursor: pointer; margin-right: 8px; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .spinner-svg { width: 16px; height: 16px; margin-right: 6px; animation: spin 1s linear infinite; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Print Queue</h2>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span id="lastSync" style="font-size:12px; color:#666;">Loading...</span>
        
        <button class="btn btn-refresh" id="refreshBtn" onclick="triggerRefresh()">
          <svg class="spinner-svg" id="refreshSpinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
            <polyline points="21 3 21 8 16 8"></polyline>
          </svg>
          <span id="refreshText">Refresh</span>
        </button>

        <button class="btn btn-open" onclick="goToPayment()" style="padding: 8px 16px; border-radius: 6px; font-size: 14px; background: var(--success);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
          Payment Portal
        </button>
      </div>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Roll</th>
          <th>Mode</th>
          <th>Total (Tk)</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="jobList">
        <tr><td colspan="6" style="text-align:center; padding: 20px;">Connecting to database...</td></tr>
      </tbody>
    </table>
    
    <button id="loadMoreBtn" class="load-more" style="display:none;" onclick="loadMore()">View More (10)</button>
  </div>

  <div class="modal" id="viewModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('viewModal')">&times;</button>
      <h2>Order Details & PDF Preview</h2>
      <div id="orderDetails" style="margin-top:15px;"></div>
    </div>
  </div>

  <div class="modal" id="deleteModal" style="z-index: 70;">
    <div class="modal-content" style="max-width: 400px; text-align: center; padding: 30px;">
      <h2 style="color: var(--danger); margin-bottom: 15px;">Confirm Deletion</h2>
      <p style="color: #475569;">Are you sure you want to permanently delete this job and remove its PDF file from Google Drive?</p>
      <div style="display: flex; gap: 10px; margin-top: 25px; justify-content: center;">
        <button class="btn" style="background: #e2e8f0; color: #334155; font-size: 15px; padding: 10px 20px;" onclick="closeModal('deleteModal')">Cancel</button>
        <button class="btn btn-delete" style="font-size: 15px; padding: 10px 20px;" onclick="executeDelete()">Yes, Delete</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbw5Hc4IAYLrXy9_enCwnvXCbYCOPme1cwfBHZVQqTy4xOCJQ_2u4RkLY84WnY7IH_SU/exec'; 

    let currentJobs = [];
    let displayCount = 10;
    let jobToDelete = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadJobs();
      setInterval(loadJobsQuietly, 30000); 
    });

    function closeModal(id) { 
      document.getElementById(id).classList.remove('active'); 
      if(id === 'deleteModal') jobToDelete = null;
    }

    function goToPayment() {
      window.location.href = 'admin-payment.html';
    }

    async function apiRequest(payload) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          }
        });
        const resJson = await response.json();
        if (resJson.success) return resJson.data;
        throw new Error(resJson.error || 'Server error occurred');
      } catch (err) {
        throw new Error(err.message || 'Server Connection Failed');
      }
    }

    async function triggerRefresh() {
      const btn = document.getElementById('refreshBtn');
      const spinner = document.getElementById('refreshSpinner');
      const text = document.getElementById('refreshText');
      
      btn.disabled = true;
      spinner.style.display = 'block';
      text.innerText = 'Refreshing...';
      
      await loadJobs();
      
      spinner.style.display = 'none';
      text.innerText = 'Refresh';
      btn.disabled = false;
    }

    async function loadJobs() {
      try {
        const jobs = await apiRequest({ action: 'adminGetJobs' });
        currentJobs = Array.isArray(jobs) ? jobs : [];
        renderTable();
        document.getElementById('lastSync').innerText = 'Last Sync: ' + new Date().toLocaleTimeString();
      } catch (err) { 
        document.getElementById('jobList').innerHTML = `<tr><td colspan="6" style="text-align:center; color:red; padding: 20px;"><strong>Error:</strong> ${err.message}</td></tr>`;
      }
    }

    async function loadJobsQuietly() {
      try {
        const jobs = await apiRequest({ action: 'adminGetJobs' });
        currentJobs = Array.isArray(jobs) ? jobs : [];
        renderTable();
        document.getElementById('lastSync').innerText = 'Last Sync: ' + new Date().toLocaleTimeString();
      } catch (err) {}
    }

    function loadMore() {
      displayCount += 10;
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('jobList');
      if (!currentJobs || currentJobs.length === 0) {
         tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px;">No pending jobs in the queue.</td></tr>`;
         document.getElementById('loadMoreBtn').style.display = 'none';
         return;
      }

      const visibleJobs = currentJobs.slice(0, displayCount);
      
      tbody.innerHTML = visibleJobs.map((job) => {
        const isCompleted = String(job['Print Status']).trim() === '1';
        let safeDate = String(job.Date || "").split('T')[0];
        let safeTime = String(job.Time || "");
        let modeDisplay = job.Mode ? job.Mode.toUpperCase() : "BW";
        let totalPages = job['Total Pages'] || '1';
        
        return `
          <tr>
            <td>${safeDate} ${safeTime}</td>
            <td><strong>${job.Roll || ''}</strong></td>
            <td>${modeDisplay} (${totalPages}p)</td>
            <td>${job['Total Amount'] || '0'}</td>
            <td>
               <label style="display:flex; align-items:center; cursor:pointer;">
                 <input type="checkbox" class="status-check" onchange="toggleCompleted('${job['Submission ID']}', this.checked)" ${isCompleted ? 'checked' : ''}>
                 ${isCompleted ? '<span class="badge success">Completed</span>' : '<span class="badge">Pending</span>'}
               </label>
            </td>
            <td>
              <button class="btn btn-view" onclick="viewJob('${job['Submission ID']}')">View</button>
              <button class="btn btn-open" style="margin-left:4px;" onclick="window.open('https://drive.google.com/file/d/${job['Drive File ID']}/view?usp=sharing', '_blank')">Open</button>
              <button class="btn btn-delete" style="margin-left:4px;" onclick="openDeleteModal('${job['Submission ID']}')">Delete</button>
            </td>
          </tr>
        `;
      }).join('');

      const loadMoreBtn = document.getElementById('loadMoreBtn');
      if (displayCount < currentJobs.length) loadMoreBtn.style.display = 'block';
      else loadMoreBtn.style.display = 'none';
    }

    async function toggleCompleted(subId, isChecked) {
      const job = currentJobs.find(j => j['Submission ID'] === subId);
      const previousStatus = job ? job['Print Status'] : "";
      
      if(job) job['Print Status'] = isChecked ? "1" : "";
      renderTable(); 
      
      try {
        await apiRequest({ action: 'adminTogglePrintStatus', subId: subId, isCompleted: isChecked });
      } catch (err) {
        alert("Status update failed. Reverting...");
        if(job) job['Print Status'] = previousStatus;
        renderTable();
      }
    }

    function openDeleteModal(subId) {
      jobToDelete = subId;
      document.getElementById('deleteModal').classList.add('active');
    }

    async function executeDelete() {
      if(!jobToDelete) return;
      
      const subId = jobToDelete;
      closeModal('deleteModal');
      
      const idx = currentJobs.findIndex(j => j['Submission ID'] === subId);
      if(idx > -1) currentJobs.splice(idx, 1);
      renderTable(); 
      
      try {
        await apiRequest({ action: 'adminDeleteJob', subId: subId });
      } catch (err) {
        alert("Delete failed on server.");
        loadJobsQuietly();
      }
    }

    function viewJob(subId) {
      const job = currentJobs.find(j => j['Submission ID'] === subId);
      if(!job) return;
      
      let details = [];
      try { details = JSON.parse(job['Page Details'] || "[]"); } catch(e) {}
      
      const directUrl = `https://drive.google.com/file/d/${job['Drive File ID']}/view?usp=sharing`;
      const isMobile = window.innerWidth <= 768;

      let html = `<div style="display:flex; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:10px;">`;
      html += `<div><p><strong>File:</strong> ${job['File Name']}</p><p><strong>Roll:</strong> ${job.Roll}</p></div>`;
      html += `<div><strong>Cost Breakdown:</strong><br><span style="font-size:12px; color:#555;">` + details.map(d => `P${d.page}: ${d.intensity} (${d.cost} Tk)`).join(', ') + `</span></div></div>`;
      
      if (isMobile) {
        html += `
          <div style="text-align:center; padding: 25px 15px; border: 1px dashed #cbd5e1; border-radius: 8px; margin-top: 15px; background: #f8fafc;">
            <p style="margin-bottom: 15px; color: #475569; font-size: 14px;">Mobile browser cookie policy blocks embedded preview.</p>
            <a href="${directUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-block; background:var(--primary); color:white; padding:10px 20px; border-radius:6px; text-decoration:none; font-weight:600;">
              Open PDF Document
            </a>
          </div>
        `;
      } else {
        html += `<iframe src="https://drive.google.com/file/d/${job['Drive File ID']}/preview" width="100%" height="450px" style="border:1px solid #ccc; border-radius:8px;"></iframe>`;
      }
      
      document.getElementById('orderDetails').innerHTML = html;
      document.getElementById('viewModal').classList.add('active');
    }
  </script>
</body>
</html>
